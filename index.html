<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🤡 絶妖星乱舞 P2 ミッシング練習</title>
    <meta property="og:title" content="DMU P2 Forsaken Trainer">
    <meta property="og:description" content="Play in your browser">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://miwi-jp.github.io/dmu_p2_forsaken_trainer/">
    <meta property="og:image" content="https://miwi-jp.github.io/dmu_p2_forsaken_trainer/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section id="start" class="card">
            <h2 id="t-title">🤡 絶妖星乱舞 P2 ミッシング練習</h2>
            <label id="l-lang">言語</label>
            <div class="seg" id="s-lang"></div>
            <label id="l-meth">処理法</label>
            <div class="seg" id="s-meth"></div>
            <label id="l-difficulty">
                <span id="l-difficulty-text">難易度</span>
                <span id="i-difficulty" class="info-icon" tabindex="0">&#9432;<span class="tooltip" id="i-difficulty-tip"></span></span>
            </label>
            <div class="seg" id="s-difficulty"></div>
            <button class="go" id="b-go">スタート</button>
            <p id="t-hint" style="font-size:0.9em;color:#666;margin-top:12px;text-align:center;">
                スタート後、フィールド上のポジションをクリックして選択してください
            </p>
        </section>

        <section id="game" class="hide">
            <div id="hd">
                <span id="h1"></span>
                <span id="h2"></span>
            </div>
            <svg id="sv" viewBox="0 0 966 966"></svg>
            <div id="msg"></div>
            <div class="row">
                <button id="b-again" class="hide">最初から</button>
            </div>
            <div class="row hide" id="choice">
                <button id="c-stay">とどまる</button>
                <button id="c-south">南側へ移動</button>
            </div>
        </section>

        <footer id="ft">
            FINAL FANTASY XIV &copy; SQUARE ENIX<br>
            Unofficial fan-made tool by Mi Wi
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
